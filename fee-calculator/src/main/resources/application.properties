spring.application.name=fee-calculator

# Disable web server (batch job runs and exits)
spring.main.web-application-type=none

# ----- H2 File Database -----
# The file is stored in ./data/batch_db.mv.db
# DB_CLOSE_ON_EXIT=FALSE keeps the database alive after the JVM exits
# AUTO_RECONNECT=TRUE helps during development
# H2 File Database (enables restartability)
spring.datasource.url=jdbc:h2:file:./data/batch_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----- Spring Batch Metadata Schema -----
# Automatically creates BATCH_* tables on startup
# Initialize Spring Batch metadata tables automatically
spring.batch.jdbc.initialize-schema=always

# ----- Business Schema -----
# Execute schema.sql (classpath) to create onboarding_fee_audit table
# Initialize business schema from schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Logging for operational visibility (US-05)
logging.level.org.springframework.batch=INFO
logging.level.com.desabi.guide.spring.batch.feecalculator=DEBUG

# ----- Job Execution Control -----
# Prevent Spring Boot from automatically running all Job beans on startup;
# we manually launch the job via the CommandLineRunner after parameter parsing.
spring.batch.job.enabled=false