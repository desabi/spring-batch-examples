spring:
  application:
    name: postal-codes
  datasource:
    url: jdbc:h2:file:./data/db/postalcodes
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    jdbc:
      initialize-schema: always

app:
  input:
    file: ./data/csv/postal_codes.csv